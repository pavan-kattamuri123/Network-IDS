{% extends 'base.html' %}
{% block content %}
<div class="login-wrapper">
    <!-- Animated background elements specific to login -->
    <div class="login-blob blob-1"></div>
    <div class="login-blob blob-2"></div>
    
    <div class="login-card-premium">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Secure access to SafeNet IDS</p>
        </div>

        <a href="/google/login" class="google-btn-premium">
            <div class="google-icon-wrapper">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="google-icon">
            </div>
            <span class="google-text">Continue with Google</span>
        </a>
    </div>
</div>

<style>
.login-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
    position: relative;
    z-index: 1;
}

/* Glowing background blobs */
.login-blob {
    position: absolute;
    filter: blur(80px);
    z-index: -1;
    opacity: 0.5;
    animation: float 10s infinite ease-in-out alternate;
}

.blob-1 {
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, var(--grad-start) 0%, transparent 70%);
    top: 10%;
    left: 25%;
    animation-delay: -2s;
}

.blob-2 {
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, var(--grad-end) 0%, transparent 70%);
    bottom: 10%;
    right: 25%;
}

@keyframes float {
    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(-30px) scale(1.1); }
}

/* Premium Card */
.login-card-premium {
    background: rgba(14, 20, 38, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    padding: 50px 48px;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    position: relative;
    overflow: hidden;
    animation: slideUpFade 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
}

@keyframes slideUpFade {
    0% { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
}

/* Subtle top gradient border shine */
.login-card-premium::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--grad-start), var(--grad-end), transparent);
    opacity: 0.8;
}

.login-header {
    text-align: center;
    margin-bottom: 40px;
    width: 100%;
}

.login-header h2 {
    font-size: 2rem;
    font-weight: 700;
    font-family: 'Outfit', sans-serif;
    margin-bottom: 8px;
    color: var(--text-main);
    letter-spacing: -0.02em;
}

.login-header p {
    color: var(--text-muted);
    font-size: 1.05rem;
}

/* Premium Google Button */
.google-btn-premium {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #ffffff;
    color: #3c4043;
    font-family: 'Inter', sans-serif;
    font-size: 1.15rem;
    font-weight: 600;
    text-decoration: none;
    padding: 12px 16px;
    border-radius: 14px;
    width: 100%;
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
    border: 1px solid transparent;
}

.google-btn-premium:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
    background: #fdfdfd;
}

.google-btn-premium:active {
    transform: translateY(-1px);
}

.google-icon-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border-radius: 10px;
    padding: 6px;
}

.google-icon {
    width: 26px;
    height: 26px;
}
</style>
{% endblock %}
